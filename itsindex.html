<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pro Calculator PWA</title>
<link id="manifestLink" rel="manifest">
<style>
  /* same CSS as earlier, or your preferred styles */
  :root{--bg:#000;--accent:#00f0ff}
  body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh}
  .wrap{width:320px;padding:20px;border-radius:12px;background:#0b0b0b;box-shadow:0 8px 30px rgba(0,0,0,.6)}
  .title{text-align:center;margin-bottom:12px;color:var(--accent);font-weight:700}
  .display{height:64px;background:#000;color:var(--accent);font-size:28px;border-radius:8px;padding:12px;text-align:right;box-shadow:inset 0 0 12px rgba(0,240,255,0.06);overflow:hidden}
  .grid{display:flex;flex-wrap:wrap;margin-top:12px;gap:8px}
  .btn{flex:1 0 22%;height:56px;border-radius:8px;border:0;background:#222;color:var(--accent);font-size:20px;cursor:pointer}
  .wide{flex:1 0 96%}
  .install-btn{display:none;padding:12px 18px;border-radius:999px;background:linear-gradient(45deg,#00f0ff,#0066ff);color:#001;font-weight:700;border:0;margin-bottom:12px;cursor:pointer}
</style>
</head>
<body>
  <button id="installBtn" class="install-btn">🚀 Install Calculator App</button>
  <div class="wrap">
    <div class="title">Pro Calculator PWA</div>
    <div id="display" class="display">0</div>
    <div class="grid">
      <!-- buttons same as before -->
      <button class="btn" onclick="press('7')">7</button>
      <button class="btn" onclick="press('8')">8</button>
      <button class="btn" onclick="press('9')">9</button>
      <button class="btn" onclick="press('/')">÷</button>

      <button class="btn" onclick="press('4')">4</button>
      <button class="btn" onclick="press('5')">5</button>
      <button class="btn" onclick="press('6')">6</button>
      <button class="btn" onclick="press('*')">×</button>

      <button class="btn" onclick="press('1')">1</button>
      <button class="btn" onclick="press('2')">2</button>
      <button class="btn" onclick="press('3')">3</button>
      <button class="btn" onclick="press('-')">−</button>

      <button class="btn" onclick="press('0')">0</button>
      <button class="btn" onclick="press('.')">.</button>
      <button class="btn" onclick="calculate()">=</button>
      <button class="btn" onclick="press('+')">+</button>

      <button class="btn wide" onclick="clearDisplay()">CLEAR</button>
    </div>
  </div>

<script>
/* Calculator logic */
const display = document.getElementById('display');
function press(ch){
  if(display.innerText === '0' || display.innerText === 'Error') display.innerText = ch;
  else display.innerText += ch;
}
function calculate(){
  try{
    if(!/^[0-9+\-*/().\s]+$/.test(display.innerText)) { display.innerText = 'Error'; return; }
    const res = Function('"use strict";return (' + display.innerText + ')')();
    display.innerText = String(res);
  }catch(e){ display.innerText = 'Error'; }
}
function clearDisplay(){ display.innerText = '0'; }

/* Create dynamic manifest as a blob so you don't need manifest.json file */
const manifest = {
  name: "Pro Calculator",
  short_name: "Calculator",
  start_url: ".",
  display: "standalone",
  background_color: "#000000",
  theme_color: "#000000",
  icons: [
    { src: "icon-192.png", sizes: "192x192", type: "image/png" },
    { src: "icon-512.png", sizes: "512x512", type: "image/png" }
  ]
};
const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
const manifestURL = URL.createObjectURL(manifestBlob);
document.getElementById('manifestLink').setAttribute('href', manifestURL);

/* PWA install button logic */
let deferredPrompt;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'inline-block';
});
installBtn.addEventListener('click', async () => {
  installBtn.style.display = 'none';
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
});

/* Register external service worker (required file) */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/service-worker.js')
    .then(()=>console.log('SW registered'))
    .catch(err=>console.warn('SW failed', err));
}
</script>
</body>
</html>
